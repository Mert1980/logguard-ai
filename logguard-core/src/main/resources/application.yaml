spring:
  application:
    name: logguard-ai
  datasource:
    url: jdbc:h2:file:./data/logguard;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logguard:
  poll-interval: PT1H
  deduplication-window: PT24H
  max-delivery-attempts: 3
  max-consecutive-poll-failures: 10
  own-code-package-prefixes:
    - "be.vdab"
  open-search:
    uri: http://localhost:9200
    index-name: "demo-logs"
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: gemini-2.0-flash
  google-chat:
    webhook-url: ${GOOGLE_CHAT_WEBHOOK_URL:}
  gitlab-repositories: []
