spring:
  application:
    name: logguard-ai
  main:
    keep-alive: true                # non-web daemon: keep the JVM alive for the @Scheduled poll loop
                                     # (virtual threads are daemon threads and don't keep it alive)
  threads:
    virtual:
      enabled: true                 # Java 21 Loom — blocking Ollama HTTP calls don't stall the scheduler (AR-12)
  datasource:
    url: jdbc:h2:file:${logguard.h2.data-dir:./data}/logguard   # file-based H2 so PollCheckpoint survives restarts (AR-5)
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate            # no auto-DDL — schema is owned by Flyway (AR-6)
  flyway:
    enabled: true
    locations: classpath:db/migration   # empty in this story → "Successfully applied 0 migrations"
  ai:
    ollama:
      # Single source of truth is logguard.ollama.* — Spring AI's Ollama autoconfig reads these.
      base-url: ${logguard.ollama.base-url:http://localhost:11434}
      chat:
        options:
          model: ${logguard.ollama.model:gemma3:4b}
  http:
    client:
      # Bridge logguard.ollama.timeout to the HTTP read timeout of the Spring AI Ollama RestClient —
      # the only Spring-managed HTTP client here (OpenSearch uses its own transport). Without this the
      # 120s timeout property was dead. P1 / Story 3.2 AC.
      read-timeout: ${logguard.ollama.timeout:120s}

logguard:
  poll-interval: 20s
  # Hard ceiling (seconds) on one poll cycle's transaction (query + all per-error LLM calls) so a large
  # un-deduplicated batch can't starve the connection pool indefinitely (D2 / AR-9).
  poll-transaction-timeout-seconds: 600
  deduplication-window: 60s
  escalation-thresholds: [5, 100, 1000]
  max-consecutive-poll-failures: 3
  own-code-package-prefixes:
    - be.vdab
  suppression-file-path: ./suppression.txt
  ollama:
    base-url: http://localhost:11434
    model: gemma3:4b
    timeout: 120s
  opensearch:
    base-url: http://localhost:9200
    # Matches the index the companion app (Story 1.2) writes to — Story 2.3 needs no change.
    index-pattern: logstash-app-openshift-application-springboot_error_*
    # Re-scan this window each cycle so errors made searchable after the query (OpenSearch refresh lag)
    # are not skipped; Epic 4 dedup removes the resulting harmless double-fetch (D1).
    refresh-window: 5s
  h2:
    data-dir: ./data
