spring:
  application:
    name: logguard-ai
  main:
    keep-alive: true                # non-web daemon: keep the JVM alive for the @Scheduled poll loop
                                     # (virtual threads are daemon threads and don't keep it alive)
  threads:
    virtual:
      enabled: true                 # Java 21 Loom — blocking Ollama HTTP calls don't stall the scheduler (AR-12)
  datasource:
    url: jdbc:h2:file:${logguard.h2.data-dir:./data}/logguard   # file-based H2 so PollCheckpoint survives restarts (AR-5)
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate            # no auto-DDL — schema is owned by Flyway (AR-6)
  flyway:
    enabled: true
    locations: classpath:db/migration   # empty in this story → "Successfully applied 0 migrations"
  ai:
    ollama:
      # Single source of truth is logguard.ollama.* — Spring AI's Ollama autoconfig reads these.
      base-url: ${logguard.ollama.base-url:http://localhost:11434}
      chat:
        options:
          model: ${logguard.ollama.model:gemma3:4b}
  http:
    client:
      # Bridge logguard.ollama.timeout to the HTTP read timeout of the Spring AI Ollama RestClient —
      # the only Spring-managed HTTP client here (OpenSearch uses its own transport). Without this the
      # 120s timeout property was dead. P1 / Story 3.2 AC.
      read-timeout: ${logguard.ollama.timeout:120s}

logguard:
  poll-interval: 30s
  # Hard ceiling (seconds) on one poll cycle's transaction (query + all per-error LLM calls) so a large
  # un-deduplicated batch can't starve the connection pool indefinitely (D2 / AR-9).
  poll-transaction-timeout-seconds: 600
  deduplication-window: 24h
  escalation-thresholds: [10, 100, 1000]
  max-consecutive-poll-failures: 3
  own-code-package-prefixes:
    - be.vdab
  suppression-file-path: ./suppression.txt
  ollama:
    base-url: http://localhost:11434
    model: gemma3:4b
    timeout: 120s
  opensearch:
    # Default is the local Docker instance (plain HTTP, no auth — Story 1.1). Point at a secured
    # production cluster purely via environment variables — no profile files. Set LOGGUARD_OPENSEARCH_BASE_URL
    # to an https:// URL plus the username/password below; the client wires basic-auth + TLS only when set.
    base-url: ${LOGGUARD_OPENSEARCH_BASE_URL:http://localhost:9200}
    # Matches the index the companion app (Story 1.2) writes to — Story 2.3 needs no change.
    index-pattern: ${LOGGUARD_OPENSEARCH_INDEX_PATTERN:logstash-app-openshift-application-springboot_error_*}
    # Re-scan this window each cycle so errors made searchable after the query (OpenSearch refresh lag)
    # are not skipped; Epic 4 dedup removes the resulting harmless double-fetch (D1).
    refresh-window: 5s
    # Basic-auth credentials for a secured cluster. Blank = no auth (local). These carry secrets, so they
    # have no hard-coded default — supply via the environment (read-only service account recommended).
    username: ${LOGGUARD_OPENSEARCH_USERNAME:}
    password: ${LOGGUARD_OPENSEARCH_PASSWORD:}
    # Optional truststore for a private/self-signed CA (common on OpenShift). Blank = JDK default trust
    # (works for public-CA https). Point at a .p12/.jks holding the cluster's CA certificate.
    truststore-path: ${LOGGUARD_OPENSEARCH_TRUSTSTORE_PATH:}
    truststore-password: ${LOGGUARD_OPENSEARCH_TRUSTSTORE_PASSWORD:}
    # Applied to the transport only when connecting over https (prod); the local plain-HTTP path is unchanged.
    connect-timeout: 5s
    socket-timeout: 10s
  h2:
    data-dir: ./data
  google-chat:
    # When true, every notification is POSTed to the incoming webhook below instead of the terminal
    # (the GoogleChatOutputAdapter becomes the primary TerminalOutputPort).
    enabled: true
    # Carries a space key/token secret — override in the environment with LOGGUARD_GOOGLE_CHAT_WEBHOOK_URL.
    webhook-url: ${LOGGUARD_GOOGLE_CHAT_WEBHOOK_URL:}
    timeout: 10s
