# Tests run against an isolated in-memory H2 (not the ./data file DB). Overrides only the datasource
# URL; everything else (logguard.*, jpa, flyway) is inherited from the main application.yml.
spring.datasource.url=jdbc:h2:mem:logguard-test;DB_CLOSE_DELAY=-1

# Keep tests hermetic: no scheduled poll loop hitting localhost:9200 during @SpringBootTest.
logguard.scheduler.enabled=false
# Don't keep the JVM alive in tests (the Spring test framework owns context lifecycle).
spring.main.keep-alive=false
