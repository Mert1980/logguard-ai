# LogGuard AI — local development stack.
#   - `opensearch`              : single-node OpenSearch (Story 1.1)
#   - `logguard-error-producer` : companion app that writes structured test errors (Story 1.2)
#
# Usage:
#   docker compose up                   (build + start everything, foreground)
#   docker compose up -d                (detached)
#   docker compose up opensearch        (just OpenSearch)
# Then produce a test error:
#   curl -XPOST http://localhost:8080/trigger-error
#
# Security is DISABLED for local dev: OpenSearch serves plain HTTP on :9200 with
# no auth/TLS. Use DISABLE_SECURITY_PLUGIN=true — the older `plugins.security.disabled`
# env var stopped taking effect in OpenSearch 2.12+ (opensearch-project/security#4062).

services:
  opensearch:
    image: opensearchproject/opensearch:2
    container_name: logguard-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q opensearch"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  logguard-error-producer:
    build: ./logguard-error-producer
    container_name: logguard-error-producer
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      # Companion talks to OpenSearch over the compose network, not localhost.
      - OPENSEARCH_URL=http://opensearch:9200
    ports:
      # Exposes POST /trigger-error to the host so a developer can produce test errors.
      - "8080:8080"
